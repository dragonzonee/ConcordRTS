; Autoplay: deploy the MCV, build a Power Plant from the sidebar, select the
; starting troops, march toward the enemy and attack the nearest enemy object.
; Run:  bin\concord_runtime.exe --config local_data\runtime_config.ini
;         --resource-root RedAlert2 --local-data-root local_data
;         --autoplay tests\autoplay\build_and_attack.ini --autoplay-out build\autoplay\build_and_attack

[Game]
Map=2peaks.map
Country=Americans
Enemy=Russians
AI=no                 ; passive enemy: a stable target
Credits=10000
Units=5               ; starting troops besides the MCV
Speed=6               ; fastest
MaxTicks=30000

[Steps]
1=Screenshot start
2=DeployMCV
3=WaitUntil BaseReady 900
4=ClickSidebar GAPOWR
5=WaitUntil BuildReady GAPOWR 3000
6=PlaceBuilding GAPOWR NearBase
7=WaitUntil BuildingExists GAPOWR 1 600
8=Screenshot base_with_power
9=SelectUnits All
10=Expect Selected 1
11=MoveTo EnemyBase 8
12=WaitTicks 1500
13=Screenshot near_enemy
14=SelectUnits All
15=AttackTarget Any
16=WaitUntil TargetDestroyed 9000
17=Screenshot after_attack
